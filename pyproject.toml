[tool.pip-tools]
allow_unsafe = true
generate_hashes = true
reuse_hashes = true
upgrade = true

[tool.pyright]
exclude = ["**/.*", "**/__pycache__", "typings", "venv"]
pythonPlatform = "Linux"
pythonVersion = "3.13"
stubPath = "stubs"
typeCheckingMode = "strict"

reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true
